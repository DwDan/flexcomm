name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  validate-commit:
    name: Validate Commit Message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Conventional Commit
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            ci
            build
            revert

      - name: Ensure commit message references an issue
        run: |
          echo "🔍 Validando referência a issue..."
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Mensagem: $COMMIT_MSG"

          ISSUE_PATTERN="#[0-9]{1,}"

          if ! echo "$COMMIT_MSG" | grep -qE "$ISSUE_PATTERN"; then
            echo "❌ O commit deve referenciar uma issue no formato: #<número>"
            echo "➡️  Exemplo: feat(core): adiciona validação #123"
            exit 1
          fi

  backend-tests:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./backend

      - name: Build
        run: dotnet build ./backend --no-restore --configuration Release

      - name: Run tests with longer timeout
        run: |
            dotnet build ./backend/FlexComm.sln --configuration Release
            dotnet test ./backend/FlexComm.sln --no-build --verbosity normal --logger trx --results-directory ./TestResults
  
  frontend-tests:
    name: Run Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        working-directory: ./frontend-web
        run: npm ci

      - name: Run tests
        working-directory: ./frontend-web
        run: npm run test -- --watch=false --browsers=ChromeHeadless
